<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アプリ プライバシーポリシー</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(880px, 100%);
      margin: 0 auto;
      padding: 32px 16px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.25;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    ul {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: block;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      background: #fff;
    }

    a:hover {
      border-color: var(--accent);
    }

    small {
      display: block;
      margin-top: 24px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>アプリ プライバシーポリシー</h1>
      <p>公開中アプリのプライバシーポリシー一覧です。</p>
      <ul>
        <li><a href="./due-keeper/privacy.html">まもる期限メモ / Due Keeper</a></li>
        <li><a href="./due-memo/privacy.html">Due Memo</a></li>
      </ul>
      <small>お問い合わせ: alcedo@outlook.jp</small>
    </section>
  </main>
</body>
</html>
